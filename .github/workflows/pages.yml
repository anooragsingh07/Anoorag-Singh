name: Test and deploy static portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify generated files are up to date
        run: |
          node tools/build.cjs
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files differ from the committed versions:"
            git status --porcelain
            git diff
            exit 1
          fi
      - name: SEO metadata checks
        run: node tools/seo-check.cjs
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "static server failed to start"
          exit 1
      - name: Layout and overflow checks (7 viewports)
        run: node tests/overflow.mjs
      - name: Interaction checks
        run: node tests/interactions.mjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: true
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
